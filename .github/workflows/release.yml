name: Windows release
on:
  push:
    tags: ['v0.*.*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          if ($version -notmatch '^0\.[0-9]+\.[0-9]+$') { throw 'Invalid version' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Privacy and unit checks
        shell: pwsh
        run: |
          python tools/check_publication.py
          if ($LASTEXITCODE) { throw 'Publication audit failed' }
          python -m pip install -r tools/requirements.txt
          python -m pytest tests/test_tools.py -q
          if ($LASTEXITCODE) { throw 'Python tests failed' }
      - name: Build single executable
        shell: pwsh
        run: ./build.ps1 -Publish -Version $env:RELEASE_VERSION
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/${{ env.RELEASE_VERSION }}/*.exe
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @((Get-ChildItem "artifacts/$env:RELEASE_VERSION/*.exe").FullName, (Resolve-Path "artifacts/$env:RELEASE_VERSION/SHA256SUMS.txt").Path)
          gh release create $env:RELEASE_TAG @assets --verify-tag --prerelease --title "Ritual Checker $env:RELEASE_VERSION" --notes-file docs/releases/$env:RELEASE_VERSION.md
          if ($LASTEXITCODE) { throw 'Release publishing failed' }
